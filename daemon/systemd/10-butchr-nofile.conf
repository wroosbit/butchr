# Drop-in for herdr.service, installed by daemon/scripts/install-service.sh.
#
# WHY THIS EXISTS
#
# herdr holds 5 open /dev/ptmx descriptors per pane — measured on herdr 0.6.4,
# and it is not a leak: they are four dup()s of one pty master plus the master
# itself, and all five are returned when the pane closes (KAN-24). But 5 per
# pane against the default soft limit of 1024 is a hard ceiling at roughly 205
# panes, reached by ordinary terminal use rather than abuse. Past it,
# `herdr agent start` fails for everything until panes are closed.
#
# A systemd --user unit inherits the manager's default, which on a stock
# Ubuntu 24.04 host is soft 1024 / hard 1048576 — so a herdr started this way
# lands on the ceiling and a `prlimit` applied by hand does not survive the
# next restart. This drop-in is where the limit stops being folklore.
#
# ON THE FD_SETSIZE HAZARD (raised on KAN-24, and the reason this is not just
# a bigger number): the 1024 default is FD_SETSIZE, the largest descriptor
# select(2) can represent. Raising the limit above it is undefined behaviour
# for any process that calls select() and would corrupt memory in the process
# holding every terminal. Before writing this file, herdr 0.6.4 was traced
# through server start, three agent spawns, an attach and a detach — 32,303
# syscalls, of which select/pselect6/_newselect: zero. Its readiness syscall
# is poll(), which takes an explicit array of descriptor numbers and has no
# FD_SETSIZE limit. `nm` on the (unstripped, static) binary finds no select
# symbol either. The evidence and its limits are written up in docs/SETUP.md.
#
# Re-check this if herdr changes its event loop. `daemon/scripts/butchr-doctor.mjs`
# reports the live soft limit so a machine that lost it says so out loud.
[Service]
LimitNOFILE=65536:1048576
