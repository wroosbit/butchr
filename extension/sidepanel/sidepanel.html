<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butchr Agent Control</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="icon">🔪</span>
      <h1>Butchr</h1>
    </div>
    <div id="daemon-badge" class="badge badge-disconnected">Daemon Offline</div>
  </div>

  <nav class="tabs-nav">
    <button id="nav-active" class="tab-btn active">Active Page</button>
    <button id="nav-agents" class="tab-btn">
      Running Agents <span id="agent-count-badge" class="count-badge">0</span>
    </button>
  </nav>

  <!-- Active Page View -->
  <div id="view-active-page" class="view-panel">
    <div class="card">
      <div class="card-title">Active Page Context</div>
      <div id="page-url" class="url-display">Detecting active tab...</div>
      
      <div id="workspace-info" class="workspace-box hidden">
        <div class="info-row">
          <span class="label">Workspace Type:</span>
          <span id="ws-type" class="value">task</span>
        </div>
        <div class="info-row">
          <span class="label">Jira Key:</span>
          <span id="ws-key" class="value key-highlight">-</span>
        </div>
      </div>

      <div id="unsupported-box" class="warning-box hidden">
        Current page does not match a supported Workspace Type (e.g. Jira issue).
      </div>
    </div>

    <div class="action-section">
      <button id="activate-btn" class="btn btn-primary" disabled>
        ⚡ Activate Herdr Agent
      </button>
    </div>

    <div id="agent-status-card" class="card hidden">
      <div class="card-title">Agent Status</div>
      <div class="status-indicator">
        <span class="dot dot-active"></span>
        <span id="agent-session-id" class="session-text">Agent Connected</span>
      </div>
    </div>
  </div>

  <!-- Running Agents View -->
  <div id="view-agents" class="view-panel hidden">
    <div class="card">
      <div class="card-title">Active Herdr Agents</div>
      <div id="agents-list" class="agents-list">
        <div class="empty-state">No agents currently running.</div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
