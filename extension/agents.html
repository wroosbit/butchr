<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butchr Agents</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #334155;
      --border-radius: 8px;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      border: 1px solid var(--border);
      padding: 20px;
    }
    .agent-item {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .agent-item:last-child {
      border-bottom: none;
    }
    .agent-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .agent-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .agent-type {
      background-color: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .agent-meta {
      color: var(--text-muted);
      font-size: 13px;
    }
    .agent-link {
      color: #60a5fa;
      text-decoration: none;
      cursor: pointer;
    }
    .agent-link:hover {
      text-decoration: underline;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-active {
      background-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
    }
  </style>
</head>
<body style="background-color: #090d16;">
  <div id="root"></div>
  <script type="module" src="agents.jsx"></script>
</body>
</html>
