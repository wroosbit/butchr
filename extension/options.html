<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butchr Settings</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #334155;
      --border-radius: 8px;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 24px;
      font-weight: 700;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      border: 1px solid var(--border);
      padding: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .form-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
    }
    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: var(--accent-hover);
    }
    #status {
      margin-top: 10px;
      color: #10b981;
      font-size: 14px;
      height: 20px;
    }
  </style>
</head>
<body style="background-color: #090d16;">
  <div id="root"></div>
  <script type="module" src="options.jsx"></script>
</body>
</html>
