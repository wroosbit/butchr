name: Build & Publish Chrome Extension

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - '.github/workflows/deploy-extension.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Secrets referenced in `with:` are invisible to step-level `if:`; mapping
    # this one into env lets the publish guard actually test it. Publish stays
    # inert until the repo secrets are configured, then arms itself.
    env:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extension

      - name: Build extension
        run: npm run build
        working-directory: extension

      - name: Package Chrome Extension
        # Zip the *built* extension from extension/dist — manifest.json must
        # sit at the zip root or the Web Store rejects the upload.
        run: |
          mkdir -p dist
          cd extension/dist
          zip -r ../../dist/butchr-extension.zip .

      - name: Upload & Publish to Chrome Web Store
        # NOTE: the store rejects uploads that reuse an existing version —
        # bump "version" in extension/public/manifest.json when releasing.
        # NOTE: actions are resolved before step `if:` conditions are
        # evaluated, so an invalid ref here fails the whole job even when the
        # step would be skipped. Keep this pinned to a tag that exists —
        # v-prefixed tags for this action start at v4.0.0.
        # Belt and braces: this workflow is push-only today, but publishing
        # must never fire from a PR or a branch even if triggers change.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CHROME_CLIENT_ID != ''
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: 'dist/butchr-extension.zip'
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish-target: 'default' # Or 'trustedTesters'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: butchr-extension-zip
          path: dist/butchr-extension.zip
