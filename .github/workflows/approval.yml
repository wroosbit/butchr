name: Approval

# KAN-306: the gate that makes "approval before merge" a mechanism rather than a
# habit every agent happens to have kept.
#
# WHY A SEPARATE WORKFLOW FROM `ci.yml`, AND NOT A SEVENTH JOB IN IT. The
# triggers are different in kind. Everything in `ci.yml` is a function of the
# tree, so it runs on `pull_request` and on `push`. This is a function of the
# *conversation* on the pull request: an approval arrives after the push that
# built it, so this has to wake on `issue_comment` too. Adding a comment trigger
# to `ci.yml` would re-run six jobs — including the five-minute
# `verify-runnable-set` — on every comment anybody ever posts.
#
# THE CHECK NAME IS NOT THIS JOB'S NAME, DELIBERATELY. The required context is
# `approval-recorded`, and it is a *commit status* the script POSTs at the pull
# request head. A workflow triggered by `issue_comment` attaches its own check
# run to the default branch rather than to the pull request head, where branch
# protection would never see it — so a job named `approval-recorded` would
# report to the right place on one trigger and the wrong place on the other. A
# posted status lands at the head every time. The job is therefore named
# `approval-gate` so that exactly one thing in this repository is called
# `approval-recorded`.
#
# AND THE TWO NAMES ANSWER TWO DIFFERENT QUESTIONS — KAN-317, and this is the
# half that was missing above rather than a correction to it:
#
#   `approval-recorded`  (a commit status, REQUIRED)  is this head approved?
#   `approval-gate`      (this job, NOT required)     did the gate manage to say?
#
# A GREEN JOB OVER A RED STATUS IS THEREFORE NORMAL, and it is what an
# unapproved pull request looks like: the gate worked, and the answer is no. The
# merge is blocked by the required status, which is the only thing branch
# protection reads.
#
# It used to publish the approval answer here too, and that was the defect
# KAN-317 fixed. A run's conclusion is fixed when the run ends, and — by the very
# mechanism the paragraph above describes — the comment-triggered re-evaluation
# attaches to the default branch, so it can never replace this run's red. Every
# pull request starts unapproved, so every pull request earned a permanent red
# `approval-gate`, so every APPROVED pull request read `mergeStateStatus:
# UNSTABLE` rather than `CLEAN`. That is not cosmetic: the natural repair for
# UNSTABLE is `gh pr update-branch`, which moves the head and voids the approval
# marker, and that loop cost #138 a re-review. The status can retract an answer;
# a job conclusion cannot, so only the status carries one.
#
# The full argument is on `exitCodeFor` in `daemon/scripts/lib/approval-marker.mjs`.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches:
      - main

# `statuses: write` is what lets the script publish `approval-recorded`.
# `pull-requests` and `issues` are read-only: an approval is an issue comment on
# a pull request, and this never writes one.
permissions:
  contents: read
  statuses: write
  pull-requests: read
  issues: read

jobs:
  approval-gate:
    name: approval-gate
    runs-on: ubuntu-latest
    # An `issue_comment` fires for ordinary issues as well as pull requests, and
    # this gate has no opinion about issues. The script checks the same thing
    # again for itself — a workflow-level `if` is an optimisation, never the
    # guard.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependency install: the script imports only node builtins and the
      # global `fetch`. Keeping it dependency-free is what keeps a required
      # check un-flaky — the same argument that earned `verify-script-sweep`,
      # `operative-rule-carriage` and `ci-partition` their required status.
      #
      # GITHUB_TOKEN is read from the environment at the point of use and sent
      # in an Authorization header. It is never echoed, never passed as an
      # argument, and never printed — arguments are visible in process listings
      # and in logs alike.
      # This step goes red only when the GATE is broken — it could not read the
      # head, could not publish the status, or contradicted itself. An
      # unapproved pull request is a red `approval-recorded` status and a green
      # step, deliberately; see the header. The script prints both verdicts
      # side by side so a reader of this log never has to infer which is which.
      - name: Publish the approval verdict as `approval-recorded` at this head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node daemon/scripts/check-approval-recorded.mjs
