name: CI

# No path filters: these are required status checks, and a check that is
# skipped by a path filter never reports, which would block every PR that
# happens not to touch that path.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  daemon-typecheck:
    name: daemon-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daemon/package-lock.json

      # --ignore-scripts skips node-pty's native build, which typechecking
      # does not need and which is the slowest, most fragile part of install.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: daemon

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: daemon

      # KAN-223: the step above cannot see the seam being undone. Revert both
      # `router.ts` and `daemon.ts` to the concrete `HerdrBridge` and it passes
      # green with the property the ticket exists to establish entirely gone —
      # demonstrated by `verify-agent-runtime-seam.mjs`, section 1. This project
      # typechecks the stub implementation against the real wiring sites, so
      # "a second runtime can drop in" is enforced rather than asserted.
      #
      # Same job, not a new one: it is the same pure `tsc` invocation over the
      # same checkout with the same install, so it adds no flakiness surface.
      # It emits nothing — the fixture lives outside `src/` and is noEmit.
      - name: Typecheck the agent-runtime seam
        run: npx tsc -p typecheck/tsconfig.json
        working-directory: daemon

  # KAN-133: the sweep enforcing that every `verify-` script can report failure
  # and states what failure it would catch. It ran only when a reviewer
  # remembered to run it, so two consecutive PRs (#65, #67) were bounced for the
  # identical reason, neither author able to find out before review.
  #
  # WHY THIS IS SAFE TO REQUIRE — it is pure static analysis. It reads the files
  # under daemon/scripts and extension/scripts off the checkout and exits on a
  # count. No build, no `npm install`, no daemon, no herdr, no PTY, no network,
  # no wall clock, no shared-runner contention. There is nothing in it that can
  # be flaky, which is exactly why it earns required status where the `verify-`
  # scripts themselves — which need a built daemon, a real herdr and PTYs — do
  # not (KAN-89 lesson B: never keep a flaky required check).
  #
  # Do not "soften" this job by adding `continue-on-error`, a path filter, or an
  # `|| true`. Any of those turns the gate back into the reviewer's memory,
  # which is the failure this job exists to remove. If it goes red, the fix is
  # in the `verify-` script it names, not here.
  verify-script-sweep:
    name: verify-script-sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependency install: the sweep imports only node builtins (fs, path,
      # url). Keeping it dependency-free is what keeps it un-flaky.
      - name: Sweep verify-* scripts for verdict-driven exits
        run: node daemon/scripts/sweep-verify-exit-paths.mjs --verbose

  # KAN-240: the sweep that keeps `prompts/*.md` honest — every operative rule
  # present where an agent will meet it, no reference dangling, and no *retired*
  # rule still being taught. It was the only guard on the prompts and it ran only
  # when somebody remembered, so a pull request could delete an operative rule
  # from `prompts/task.md`, or reinstate a retired one, with all three required
  # checks green.
  #
  # WHY THIS IS SAFE TO REQUIRE — the same argument that earned `verify-script-sweep`
  # its required status, and it is the argument. The script imports only node
  # builtins (fs, path, child_process, url); it reads the four Markdown files off
  # the checkout and matches regexes. No build, no `npm install`, no daemon, no
  # herdr, no PTY, no network, no Jira, no wall clock. Its `--ref` mode is the
  # only thing that shells out to git, and CI does not pass `--ref`. Nearly all
  # ~50 other `verify-*.mjs` need a built daemon, a real herdr and PTYs, which is
  # why they are not here and this one is; if you find a second that genuinely
  # does not, file it rather than adding it to this job.
  #
  # WHY A SEPARATE JOB RATHER THAN A STEP IN verify-script-sweep — that would
  # have cost no runner and no branch-protection change, and it was rejected on
  # two counts. The check name is what a red sends the reader to: a failure here
  # is a prompt that lost a rule, and reporting it as `verify-script-sweep` would
  # point at the wrong file and falsify that job's own closing comment. And a
  # failing first step short-circuits the second, so two independent defects
  # would surface one per run. The jobs run in parallel, so the separate runner
  # costs start-up, not wall clock.
  #
  # Do not "soften" this job by adding `continue-on-error`, a path filter, or an
  # `|| true` — see the note at the top of this file on why a path filter in
  # particular is wrong for a required check. If it goes red, the fix is in the
  # prompt it names, not here.
  operative-rule-carriage:
    name: operative-rule-carriage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # KAN-241. The sweep's baseline leg asserts that no rule entry present at
      # `origin/main` has vanished from this branch — the one leg that survives
      # a merge conflict resolved carelessly in *both* the sweep and its
      # inventory, because history is not a file you resolve. The default
      # checkout is shallow and has no `origin/main`, so the leg would have
      # nothing to read and would report itself SKIPPED.
      #
      # One commit is all it needs: the leg reads a single blob out of main's
      # tree. `--depth=1` rather than `fetch-depth: 0` on the checkout keeps
      # this to one extra object fetch instead of the whole history, which
      # matters for a check that runs on every PR.
      - name: Fetch the baseline ref the vanished-id leg reads
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependency install, for the reason above: the script imports only
      # node builtins. Keeping it dependency-free is what keeps it un-flaky.
      #
      # `--require-baseline` turns an unreadable baseline into a failure instead
      # of a printed skip. Do not drop it to make a red go away: the skip path
      # exists for local runs in a clone without a remote, and a required check
      # that silently skips its strongest leg is precisely the defect KAN-241
      # was filed for.
      - name: Verify every operative rule is carried by a prompt
        run: node daemon/scripts/verify-operative-rules-are-carried.mjs --verbose --require-baseline

  extension-build:
    name: extension-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extension

      - name: Build
        run: npm run build
        working-directory: extension

      - name: Verify the build is a loadable extension
        run: |
          test -f extension/dist/manifest.json
          test -f extension/dist/sidepanel.html
          test -f extension/dist/sidepanel.js
          test -f extension/dist/background/service_worker.js
          echo "manifest, sidepanel and service worker present at dist root"
