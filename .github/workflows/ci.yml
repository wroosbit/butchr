name: CI

# No path filters: these are required status checks, and a check that is
# skipped by a path filter never reports, which would block every PR that
# happens not to touch that path.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  daemon-typecheck:
    name: daemon-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daemon/package-lock.json

      # --ignore-scripts skips node-pty's native build, which typechecking
      # does not need and which is the slowest, most fragile part of install.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: daemon

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: daemon

      # KAN-223: the step above cannot see the seam being undone. Revert both
      # `router.ts` and `daemon.ts` to the concrete `HerdrBridge` and it passes
      # green with the property the ticket exists to establish entirely gone —
      # demonstrated by `verify-agent-runtime-seam.mjs`, section 1. This project
      # typechecks the stub implementation against the real wiring sites, so
      # "a second runtime can drop in" is enforced rather than asserted.
      #
      # Same job, not a new one: it is the same pure `tsc` invocation over the
      # same checkout with the same install, so it adds no flakiness surface.
      # It emits nothing — the fixture lives outside `src/` and is noEmit.
      - name: Typecheck the agent-runtime seam
        run: npx tsc -p typecheck/tsconfig.json
        working-directory: daemon

  # KAN-133: the sweep enforcing that every `verify-` script can report failure
  # and states what failure it would catch. It ran only when a reviewer
  # remembered to run it, so two consecutive PRs (#65, #67) were bounced for the
  # identical reason, neither author able to find out before review.
  #
  # WHY THIS IS SAFE TO REQUIRE — it is pure static analysis. It reads the files
  # under daemon/scripts and extension/scripts off the checkout and exits on a
  # count. No build, no `npm install`, no daemon, no herdr, no PTY, no network,
  # no wall clock, no shared-runner contention. There is nothing in it that can
  # be flaky, which is exactly why it earns required status where the `verify-`
  # scripts themselves — which need a built daemon, a real herdr and PTYs — do
  # not (KAN-89 lesson B: never keep a flaky required check).
  #
  # Do not "soften" this job by adding `continue-on-error`, a path filter, or an
  # `|| true`. Any of those turns the gate back into the reviewer's memory,
  # which is the failure this job exists to remove. If it goes red, the fix is
  # in the `verify-` script it names, not here.
  #
  # KAN-527 ADDED A SECOND STEP TO THIS JOB RATHER THAN A SECOND JOB, and the
  # reason is the opposite of the one `operative-rule-carriage` records for
  # splitting. That guard could afford its own job because somebody with admin
  # was going to add it to branch protection; this one is a guard against a
  # defect that is invisible by construction — a script `grep` cannot see — and a
  # new job is NOT a required check until the protection list is edited, which is
  # not an agent's to do. A guard that is merged and not required is the exact
  # shape of the thing KAN-295 was filed about. So it goes where it gates on the
  # day it lands.
  #
  # THE ORDER IS DELIBERATE AND THE SHORT-CIRCUIT FAILS IN THE RIGHT DIRECTION.
  # The bytes step runs FIRST because it is a precondition for believing the
  # second: `sweep-verify-exit-paths.mjs` reads every script with
  # `readFileSync(f, 'utf8')`, which is exactly the NUL-tolerant path that let a
  # non-text script through this required check in the first place. A tree whose
  # bytes are in doubt makes its exit-path audit a claim about text nobody has
  # established is the file. So a red here stops the run before a green is
  # printed for a reading that could not be trusted anyway.
  verify-script-sweep:
    name: verify-script-sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # KAN-527. No dependency install here either — node builtins only, and it
      # reads the files as BUFFERS rather than as utf8 strings, which is the
      # whole of what makes it able to see what the step below cannot.
      - name: Sweep scripts for control bytes and unfalsifiable fallbacks
        run: node daemon/scripts/sweep-script-text-hazards.mjs --verbose

      # No dependency install: the sweep imports only node builtins (fs, path,
      # url). Keeping it dependency-free is what keeps it un-flaky.
      - name: Sweep verify-* scripts for verdict-driven exits
        run: node daemon/scripts/sweep-verify-exit-paths.mjs --verbose

      # KAN-373. A STEP IN THIS JOB rather than a new job, for the reason the
      # two steps above already give: a new job is not a required check until
      # somebody with admin edits the branch-protection list, which is not an
      # agent's to do, so a guard that arrives as its own job arrives ungated.
      #
      # The sweep above asks STRUCTURALLY whether a script's skip tally reaches
      # its verdict. This asks whether the verdict it reaches is CORRECT — that
      # a skipped-but-not-failed run really does leave the process with a
      # non-zero status, which is a claim about `process.exit` and not about the
      # shape of an expression. Neither subsumes the other.
      #
      # ⚠ `--allow-skipped` IS LOAD-BEARING HERE AND IS NOT A SOFTENER. This job
      # deliberately does no `npm install` and no build — that is what keeps it
      # un-flaky — so §3, which drives a real `dist`-importing script end to
      # end, cannot run and SKIPS. Without the flag this step would exit 2, and
      # correctly: an incomplete run is not a pass. The flag is this caller
      # saying, in a line a reviewer can read, "§1 and §2 are what I am gating
      # on here, and I know §3 did not run." §3 is not lost — `verify-runnable-
      # set` builds first and executes it there, which is why the script is
      # classified `partial` rather than `yes`.
      #
      # Do NOT reach for `continue-on-error` or `|| true` if this goes red. A
      # red here means the exit-code contract in `lib/verdict-exit.mjs` moved,
      # and that contract is the only thing standing between "the peer proved
      # it" and "nobody started a peer".
      - name: Prove a skipped section is not reported as a pass
        run: node daemon/scripts/verify-skip-is-not-a-pass.mjs --verbose --allow-skipped

      # KAN-531. A THIRD STEP IN THIS JOB RATHER THAN A NEW JOB, for KAN-527's
      # reason and not for a new one: a new job is not a required check until
      # somebody with admin edits the branch-protection list, which is not an
      # agent's to do, so a guard that arrives as its own job arrives ungated.
      # This one guards a defect that was invisible for exactly as long as
      # nothing was looking — PR #232 added 81,309 lines of compiled daemon
      # across two `daemon/dist-kan343-*` trees with all seven required checks
      # green — so it goes where it gates on the day it lands.
      #
      # THE COST OF PUTTING IT HERE IS THE JOB NAME, and it is worth naming
      # because `operative-rule-carriage` above records the opposite decision on
      # the same trade. A red here reports as `verify-script-sweep`, which is
      # about scripts and not about committed artefacts. The script prints its
      # own name and the offending paths, and the step name says what it is, so
      # the misdirection costs a reader one line. If somebody with admin later
      # adds a dedicated required check, this belongs in its own job.
      #
      # IT IS ALSO A MEMBER OF THE RUNNABLE SET BELOW, deliberately — its header
      # carries `CI-RUNNABLE: yes`, so `verify-runnable-set` discovers and runs
      # it too. Belt and braces, in the pattern `ci-partition` already sets: the
      # guard survives either wiring being removed, and its own §7 asserts both
      # are present. What it gets from being HERE rather than only there is
      # independence from the build — `verify-runnable-set` builds both packages
      # first, so a broken build takes that copy down with it.
      #
      # WHY THIS IS SAFE TO REQUIRE — the same argument as the two steps above.
      # It reads `git ls-files` and the bytes of the files it names, and builds
      # its fixtures under `os.tmpdir()`. No build, no `npm install`, no daemon,
      # no herdr, no PTY, no network, no Jira, no wall clock.
      #
      # Do not "soften" this step with `continue-on-error`, a path filter or an
      # `|| true`. If it goes red, either build output is committed — remove it
      # with `git rm -r --cached` — or a genuinely new source directory needs
      # declaring in the script's own allowlist, with the reason.
      - name: Refuse committed build output under daemon/ and extension/
        run: node daemon/scripts/verify-no-build-output-is-committed.mjs --verbose

  # KAN-240: the sweep that keeps `prompts/*.md` honest — every operative rule
  # present where an agent will meet it, no reference dangling, and no *retired*
  # rule still being taught. It was the only guard on the prompts and it ran only
  # when somebody remembered, so a pull request could delete an operative rule
  # from `prompts/task.md`, or reinstate a retired one, with all three required
  # checks green.
  #
  # WHY THIS IS SAFE TO REQUIRE — the same argument that earned `verify-script-sweep`
  # its required status, and it is the argument. The script imports only node
  # builtins (fs, path, child_process, url); it reads the four Markdown files off
  # the checkout and matches regexes. No build, no `npm install`, no daemon, no
  # herdr, no PTY, no network, no Jira, no wall clock. Its `--ref` mode is the
  # only thing that shells out to git, and CI does not pass `--ref`. Nearly all
  # ~50 other `verify-*.mjs` need a built daemon, a real herdr and PTYs, which is
  # why they are not here and this one is; if you find a second that genuinely
  # does not, file it rather than adding it to this job.
  #
  # WHY A SEPARATE JOB RATHER THAN A STEP IN verify-script-sweep — that would
  # have cost no runner and no branch-protection change, and it was rejected on
  # two counts. The check name is what a red sends the reader to: a failure here
  # is a prompt that lost a rule, and reporting it as `verify-script-sweep` would
  # point at the wrong file and falsify that job's own closing comment. And a
  # failing first step short-circuits the second, so two independent defects
  # would surface one per run. The jobs run in parallel, so the separate runner
  # costs start-up, not wall clock.
  #
  # Do not "soften" this job by adding `continue-on-error`, a path filter, or an
  # `|| true` — see the note at the top of this file on why a path filter in
  # particular is wrong for a required check. If it goes red, the fix is in the
  # prompt it names, not here.
  operative-rule-carriage:
    name: operative-rule-carriage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # KAN-241. The sweep's baseline leg asserts that no rule entry present at
      # `origin/main` has vanished from this branch — the one leg that survives
      # a merge conflict resolved carelessly in *both* the sweep and its
      # inventory, because history is not a file you resolve. The default
      # checkout is shallow and has no `origin/main`, so the leg would have
      # nothing to read and would report itself SKIPPED.
      #
      # One commit is all it needs: the leg reads a single blob out of main's
      # tree. `--depth=1` rather than `fetch-depth: 0` on the checkout keeps
      # this to one extra object fetch instead of the whole history, which
      # matters for a check that runs on every PR.
      #
      # ⚠ DO NOT RUN THIS COMMAND ON THE DEV MACHINE — not in the shared clone
      # at ~/code/<org>/<repo>, and NOT IN AN AGENT WORKTREE EITHER. A worktree's
      # `.git` is a file pointing into the shared clone and `.git/shallow` is a
      # repository-wide file, so `--depth=1` here grafts the clone for every
      # agent on the machine. KAN-523: measured on a fixture, one such fetch in
      # a worktree took the shared clone to 1 reachable commit; on the real one
      # it made the brief's governance staleness check report the whole of
      # `prompts/task.md` as changed when nothing had. It is safe HERE and only
      # here, because a runner's checkout is a throwaway with no worktrees.
      # To read the same baseline locally: `git fetch origin main`, no depth flag.
      - name: Fetch the baseline ref the vanished-id leg reads
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependency install, for the reason above: the script imports only
      # node builtins. Keeping it dependency-free is what keeps it un-flaky.
      #
      # `--require-baseline` turns an unreadable baseline into a failure instead
      # of a printed skip. Do not drop it to make a red go away: the skip path
      # exists for local runs in a clone without a remote, and a required check
      # that silently skips its strongest leg is precisely the defect KAN-241
      # was filed for.
      - name: Verify every operative rule is carried by a prompt
        run: node daemon/scripts/verify-operative-rules-are-carried.mjs --verbose --require-baseline

  # KAN-295: the partition itself — that every `verify-` script says whether CI
  # can run it, and that CI actually calls the thing that runs them.
  #
  # WHY IT IS A SEPARATE JOB FROM `verify-runnable-set` BELOW, AND NOT A STEP IN
  # IT — this is the guard against the defect the whole ticket is about: a guard
  # that exists and is not run. If it were a step in the job that builds and runs
  # the set, then a broken build would take the guard down with it, and the one
  # check that would have said "the partition has come apart" would report
  # nothing. It needs no build, so it does not share a job with one.
  #
  # It is *also* a member of the runnable set below, deliberately — the script's
  # own §4 asserts both wirings are present. Belt and braces on the one check
  # whose absence is invisible.
  #
  # WHY THIS IS SAFE TO REQUIRE — the same argument that earned
  # `verify-script-sweep` and `operative-rule-carriage` theirs. It imports only
  # node builtins, reads `ci.yml` and the script headers off the checkout, and
  # builds its fixtures under `os.tmpdir()`. No build, no `npm install`, no
  # daemon, no herdr, no PTY, no network, no Jira, no wall clock.
  #
  # Do not "soften" this job with `continue-on-error`, a path filter or an
  # `|| true`. If it goes red, the fix is in the script header it names, or in
  # `ci-partition.md`, and never here.
  ci-partition:
    name: ci-partition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify every verify-* script declares whether CI can run it
        run: node daemon/scripts/verify-ci-partition-is-enforced.mjs --verbose

  # KAN-295: run the `verify-` scripts the partition says CI can run.
  #
  # This is the job the ticket was filed for. Before it, 76 `verify-*` scripts
  # existed and CI evaluated the assertions of exactly one — every "made to go
  # red" proof on the board was a one-time demonstration at review time that
  # nothing re-evaluated after merge.
  #
  # THE SET IS NOT LISTED HERE, AND THAT IS THE POINT. The runner discovers it by
  # reading the `CI-RUNNABLE:` line out of every `verify-*.mjs` in the tree. A
  # list in this file would have put the ticket's own defect back one layer up:
  # a script could be added, be perfectly runnable, and be run by nothing,
  # because somebody forgot to edit a list. Nothing has to be edited here for a
  # new script to be picked up.
  #
  # WHY THIS IS NOT AS SAFE AS THE THREE ABOVE, STATED PLAINLY. It installs
  # dependencies and builds both packages, so it has more surface than a pure
  # static check. What it does NOT have is the flakiness that kept these scripts
  # out of CI in the first place: the runner refuses to run anything a script
  # header does not certify as needing no herdr, no live daemon, no credential,
  # no peer and no terminal, and it sandboxes `HOME` for every child so nothing
  # can reach a real fleet. Scripts that need any of those are classified `no`
  # and are not run here — `daemon/scripts/ci-partition.md` lists all of them
  # with the reason for each.
  #
  # If a script here proves flaky, the fix is to reclassify it in its own header
  # with the reason — not to add `continue-on-error` here, which would turn the
  # whole set back into a check nobody reads.
  verify-runnable-set:
    name: verify-runnable-set
    runs-on: ubuntu-latest
    steps:
      # Full history, unlike the one-object fetch `operative-rule-carriage`
      # gets. `verify-staleness-check` and `verify-staleness-over-socket` each
      # `git clone` this checkout into a scratch directory and then `git
      # checkout -B main origin/main` inside the clone — a real clone damaged
      # one way at a time is the whole design of those proofs. A clone resolves
      # `origin/*` from the *local branches* of the repository it was cloned
      # from, and a shallow checkout has none of the objects those branches
      # need.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TWO EVENTS THIS WORKFLOW RUNS ON CHECK OUT DIFFERENTLY, AND THIS STEP
      # HAS TO SURVIVE BOTH. Getting that wrong is what turned `main` red for
      # eight minutes after #126 merged, so both halves are written down.
      #
      # On `pull_request`, `actions/checkout` leaves a DETACHED HEAD at the merge
      # commit and there is no local `main` at all. A clone of this checkout then
      # gets no `origin/main`, because a clone resolves `origin/*` from the LOCAL
      # branches of its source — which is how both staleness proofs failed on the
      # first run of this job:
      #
      #     fatal: 'origin/main' is not a commit and a branch 'main' cannot be
      #     created from it
      #
      # On `push` to `main`, the branch itself IS checked out, so a local `main`
      # already exists and git refuses to move it:
      #
      #     fatal: cannot force update the branch 'main' used by worktree at ...
      #
      # So: create it only when it is missing, and never force it. On a push the
      # existing `main` is the commit under test, which is what these proofs
      # should be cloning anyway.
      #
      # Neither script is wrong. A developer's clone has a local `main`; a CI
      # checkout may not. Supplying one is the environment's job, not the proof's.
      - name: Give the checkout a local `main` for the staleness proofs to clone
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git show-ref --verify --quiet refs/heads/main; then
            echo "local main already exists at $(git rev-parse --short main) (push build)"
          else
            git branch main origin/main
            echo "created local main at $(git rev-parse --short main) (pull_request build)"
          fi
          git branch --list main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daemon/package-lock.json

      # NOT `--ignore-scripts` here, unlike `daemon-typecheck`: several of these
      # scripts import the built daemon, which pulls in node-pty, and a node-pty
      # that was never built fails at import rather than at use.
      - name: Install daemon dependencies
        run: npm ci
        working-directory: daemon

      - name: Build the daemon
        run: npm run build
        working-directory: daemon

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Build the extension
        run: npm run build
        working-directory: extension

      - name: Run every verify-* script the partition says CI can run
        run: node daemon/scripts/run-ci-verify-set.mjs

  extension-build:
    name: extension-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extension

      - name: Build
        run: npm run build
        working-directory: extension

      - name: Verify the build is a loadable extension
        run: |
          test -f extension/dist/manifest.json
          test -f extension/dist/sidepanel.html
          test -f extension/dist/sidepanel.js
          test -f extension/dist/background/service_worker.js
          echo "manifest, sidepanel and service worker present at dist root"
