name: CI

# No path filters: these are required status checks, and a check that is
# skipped by a path filter never reports, which would block every PR that
# happens not to touch that path.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  daemon-typecheck:
    name: daemon-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daemon/package-lock.json

      # --ignore-scripts skips node-pty's native build, which typechecking
      # does not need and which is the slowest, most fragile part of install.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: daemon

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: daemon

      # A step in the existing job rather than a new job: the required checks
      # are named after jobs, and adding one would leave every open PR blocked
      # on a check its branch cannot report.
      - name: Unit tests
        run: npm test
        working-directory: daemon

  extension-build:
    name: extension-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extension

      - name: Build
        run: npm run build
        working-directory: extension

      - name: Verify the build is a loadable extension
        run: |
          test -f extension/dist/manifest.json
          test -f extension/dist/sidepanel.html
          test -f extension/dist/sidepanel.js
          test -f extension/dist/background/service_worker.js
          echo "manifest, sidepanel and service worker present at dist root"
